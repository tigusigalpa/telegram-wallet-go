name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        go: ['1.21', 'stable']

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detection
        run: go test -race ./...

      - name: Build Gin adapter
        run: go test -tags gin ./middleware

      - name: Build Echo adapter
        run: go test -tags echo ./middleware

      - name: Generate library coverage report
        run: >-
          go test -covermode=atomic
          -coverpkg=github.com/tigusigalpa/telegram-wallet-go,github.com/tigusigalpa/telegram-wallet-go/middleware
          -coverprofile=coverage.out . ./middleware

      - name: Upload coverage to Codecov
        if: matrix.go == '1.21' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: true
